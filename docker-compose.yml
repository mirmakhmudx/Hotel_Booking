# The hotel booking app's database. Start: docker compose up -d   Stop: docker compose down
# The host port is 5433 so it never clashes with a PostgreSQL already installed on your Mac (port 5432).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel       # for your laptop only
    ports:
      - "${HOTEL_DB_PORT:-5433}:5432"
    volumes:
      - hotel-data:/var/lib/postgresql   # the data survives a restart

volumes:
  hotel-data:
